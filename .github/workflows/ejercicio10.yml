on:
  push:
    #se ejecutaria solo al hacer push a la rama main
    branches: [ main ]
jobs:
  calculadora:
    runs-on: ubuntu-latest
    steps:
    - name: descargamos repositorio
      uses: actions/checkout@v5
    - name: configuracion java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        
    - name: Creacion carpeta y compilacion
      run: |
        mkdir -p out
        javac -d out src/*.java
        
    - name: ejecutar test
      run: java -ea -cp out CalculadoraTest
      
    - name: Crear jar
      run: jar cfe out/calculadora.jar Main -C out .
      
    - name: ejecutar Calculadora.jar
      run: java -jar out/calculadora.jar
      
    - name: subir artefacto
      uses: actions/upload-artifact@v5
      with:
        name: calculadora
        path. out/calculadora.jar